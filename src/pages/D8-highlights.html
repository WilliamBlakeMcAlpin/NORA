<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="nora-page" content="1080x1920">
<meta name="nora-output" content="D8">
<title>NORA Highlight Covers</title>
<!--
  Story highlight covers, 1080 x 1920 px. Instagram crops the center to a circle,
  so each icon sits inside the central 600px. Suggested highlight names are in
  each section's comment.
-->
<link rel="stylesheet" href="_ig.css">
<style>
  .ico { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>

<!-- Name: NORA -->
<section class="page story" data-name="nora">
  <div class="ico"><img src="../assets/logo/monogram-white.svg" style="height:330px"></div>
</section>

<!-- Name: 333 -->
<section class="page story" data-name="editions">
  <div class="ico" style="font:300 230px/1 var(--font-editorial);letter-spacing:-0.02em">333</div>
</section>

<!-- Name: Case -->
<section class="page story" data-name="case">
  <div class="ico"><svg width="340" height="296" viewBox="0 0 340 296"><path d="M170 2 L338 294 H2 Z" fill="none" stroke="#F3F0E9" stroke-width="3"/></svg></div>
</section>

<!-- Name: Sabae -->
<section class="page story" data-name="sabae">
  <div class="ico" style="width:420px;height:200px">
    <div style="position:absolute;left:0;right:0;top:130px;height:3px;background:#F3F0E9"></div>
    <div style="position:absolute;left:50%;top:50px;width:64px;height:64px;border-radius:50%;border:3px solid #F3F0E9;transform:translateX(-50%)"></div>
  </div>
</section>

<!-- Name: Waitlist -->
<section class="page story" data-name="waitlist">
  <div class="ico" style="font:300 200px/1 var(--font-editorial)">N° —</div>
</section>

</body>
</html>
